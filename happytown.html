<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Happy Town</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9be0ff;font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;user-select:none}
canvas{display:block}
#hud{position:fixed;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.pill{background:#fffdf5ee;border:3px solid #ffd27a;border-radius:16px;padding:5px 12px;font-size:17px;color:#6b4b1f;width:fit-content}
.bars{background:#fffdf5ee;border:3px solid #ffd27a;border-radius:16px;padding:8px 12px;color:#6b4b1f;font-size:15px;display:flex;flex-direction:column;gap:5px}
.bar{display:inline-block;width:130px;height:12px;border-radius:8px;background:#eee;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px}
#bH{background:#ff9a62}#bE{background:#6fd36f}
#btns{position:fixed;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
#btns button{font-family:inherit;font-size:16px;background:#fffdf5ee;border:3px solid #9ad98a;border-radius:14px;padding:6px 12px;color:#3b6b2f;cursor:pointer}
#btns button:hover{background:#e9ffd9}
#prompt{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#3b6b2fdd;color:#fff;padding:9px 20px;border-radius:22px;font-size:20px;display:none;pointer-events:none}
#prompt b{background:#fff;color:#3b6b2f;border-radius:8px;padding:1px 9px;margin-right:8px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90vw;max-width:600px}
.t{background:#fffdf5;border:3px solid #ffb347;color:#6b4b1f;padding:8px 16px;border-radius:16px;font-size:17px;text-align:center;box-shadow:0 3px 8px #0003;animation:pop .25s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#fishmsg{position:fixed;top:28%;left:50%;transform:translateX(-50%);font-size:34px;color:#fff;text-shadow:0 3px 6px #000a;display:none;pointer-events:none;text-align:center}
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:10;padding:10px}
.box{background:#fffdf5;border:5px solid #ffd27a;border-radius:24px;padding:18px 22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;color:#5b4020;font-size:17px;line-height:1.5}
.box h2{margin:0 0 8px;font-weight:400;font-size:26px;color:#e07b24}
.box p{margin:6px 0}
.btn{display:block;width:100%;margin:6px 0;font-family:inherit;font-size:18px;padding:9px 12px;border:none;border-radius:14px;background:#7ed56f;color:#fff;cursor:pointer;box-shadow:0 3px 0 #5fb350}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{background:#ccc;box-shadow:0 3px 0 #aaa;cursor:not-allowed}
.btn.gray{background:#b9b2a5;box-shadow:0 3px 0 #958e82}
.btn.small{display:inline-block;width:auto;font-size:15px;padding:5px 12px;margin:2px}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:2px dotted #ffe0a3;flex-wrap:wrap}
.row .grow{flex:1;min-width:140px}
.tag{display:inline-block;background:#ffe9b8;border-radius:10px;padding:0 8px;font-size:14px;margin-right:4px}
.have{color:#2e9e3a}.lack{color:#d64545}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:#fff6dc;border-radius:14px;padding:8px;text-align:center;font-size:14px}
.card .em{font-size:32px}
.edu{background:#e6f6ff;border-left:6px solid #5bb8ee;padding:8px 12px;border-radius:10px;margin:8px 0;font-size:16px}
.cbar{position:relative;height:34px;background:#eee;border-radius:17px;margin:16px 0;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:#7ed56f;opacity:.9}
.mark{position:absolute;top:-2px;bottom:-2px;width:8px;background:#e5533d;border-radius:4px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:20}
.logo{font-size:48px;text-align:center;color:#ff7b4f;margin:0}
.keys span{display:inline-block;background:#fff;border:2px solid #ffd27a;border-radius:8px;padding:0 8px;margin:2px}
</style>
</head>

<div id="toast"></div>
<div id="fishmsg"></div>
<div id="prompt"></div>
<div id="modal"></div>
<div id="fade"></div>

/* ================= 저장 ================= */
const DEFAULT=()=>({coins:100,hunger:80,energy:100,day:1,time:360,
 inv:{seed_carrot:3,seed_tomato:2,seed_potato:2},
 plots:Array.from({length:6},()=>({seed:null,stage:0,w:false})),
 trees:Array(6).fill(true),npcs:[0,1,2].map(()=>({req:null,done:false,f:0})),
 dex:{},eaten:[],bal:false,quiz:0,know:0});
let S=DEFAULT();
const SAVEKEY='happytown_save_v1';
function hasSave(){try{return !!localStorage.getItem(SAVEKEY);}catch(e){return false;}}
function load(){try{const j=localStorage.getItem(SAVEKEY);if(j){S=Object.assign(DEFAULT(),JSON.parse(j));return true;}}catch(e){}return false;}
function save(quiet){try{localStorage.setItem(SAVEKEY,JSON.stringify(S));if(!quiet)toast('💾 저장했어요!');}catch(e){if(!quiet)toast('저장할 수 없는 환경이에요.');}}
function rollReq(){S.npcs.forEach(n=>{n.req=pick(RECIPES).id;n.done=false;});}

/* ================= UI 기본 ================= */
let uiOpen=true,started=false;const pend=[];
function toast(msg){const t=el('div','t',msg);$('toast').appendChild(t);while($('toast').children.length>4)$('toast').firstChild.remove();setTimeout(()=>t.remove(),4200);}
const modal=$('modal');
function openModal(build){modal.innerHTML='';const b=el('div','box');build(b);modal.appendChild(b);modal.style.display='flex';uiOpen=true;}
function closeModal(){modal.style.display='none';uiOpen=false;if(pend.length){showDisc(pend.shift());}}
function btn(txt,fn,dis){const b=el('button','btn',txt);if(dis)b.disabled=true;else b.onclick=fn;return b;}
function menu(title,desc,opts){openModal(b=>{b.appendChild(el('h2','',title));if(desc)b.appendChild(el('p','',desc));
 opts.forEach(o=>b.appendChild(btn(o.t,()=>{closeModal();if(o.fn)o.fn();},o.dis)));
 const c=btn('닫기',closeModal);c.classList.add('gray');b.appendChild(c);});}
function msgBox(title,html,okText){openModal(b=>{b.appendChild(el('h2','',title));b.appendChild(el('div','',html));b.appendChild(btn(okText||'확인',closeModal));});}

/* ================= 인벤토리 ================= */
function cnt(k){return S.inv[k]||0;}
function add(k,n){n=n||1;S.inv[k]=cnt(k)+n;if(!ITEMS[k].seed&&!S.dex[k]){S.dex[k]=true;S.know+=5;if(uiOpen)pend.push(k);else showDisc(k);}}
function dec(k,n){S.inv[k]=cnt(k)-(n||1);if(S.inv[k]<=0)delete S.inv[k];}
function catCount(c){let t=0;for(const k in S.inv)if(ITEMS[k].cat===c)t+=S.inv[k];return t;}
function hasReq(req){return req.every(r=>r.cat?catCount(r.cat)>=r.n:cnt(r.k)>=r.n);}
function consume(req){req.forEach(r=>{if(r.cat){let n=r.n;for(const k of Object.keys(S.inv)){while(n>0&&S.inv[k]>0&&ITEMS[k].cat===r.cat){dec(k);n--;}}}else dec(r.k,r.n);});}
function useEnergy(n){if(S.energy<n){toast('😵 기력이 부족해요! 음식을 먹거나 잠을 자요.');return false;}S.energy-=n;return true;}
function showDisc(k){const it=ITEMS[k];openModal(b=>{b.appendChild(el('h2','','🎉 도감에 등록됐어요!'));
 b.appendChild(el('p','',`<span style="font-size:44px">${it.e}</span> <b>${it.n}</b>`));b.appendChild(el('div','edu','💡 '+it.fact));b.appendChild(btn('알았어요!',closeModal));});}
function eat(k){const it=ITEMS[k];if(!it.food||cnt(k)<1)return;dec(k);
 S.hunger=Math.min(100,S.hunger+it.food);S.energy=Math.min(100,S.energy+it.food*0.6);
 (it.nut||[]).forEach(n=>{if(!S.eaten.includes(n))S.eaten.push(n);});
 toast(`${it.e} 냠냠! 배부름 +${it.food}`);
 if(!S.bal&&['탄수화물','단백질','비타민'].every(n=>S.eaten.includes(n))){S.bal=true;S.coins+=50;S.know+=10;
  toast('🌈 오늘 균형 잡힌 식사 성공! +50코인');}}

/* ----- 요리 미니게임 ----- */
const cook={active:false,p:0,dir:1,zs:0.4,zw:0.22,sp:1,r:null,mark:null};
function startCook(r){if(!hasReq(r.req))return;if(!useEnergy(3))return;consume(r.req);
 cook.r=r;cook.zw=0.22;cook.zs=0.15+Math.random()*0.6;cook.p=0;cook.dir=1;cook.sp=0.9+Math.random()*0.5;cook.active=true;
 openModal(b=>{b.appendChild(el('h2','',`🔥 ${r.e} ${r.n} 요리 중!`));b.appendChild(el('p','','빨간 막대가 초록 구간에 올 때 멈추세요! (Space)'));
  const bar=el('div','cbar');const z=el('div','zone');z.style.left=cook.zs*100+'%';z.style.width=cook.zw*100+'%';
  const m=el('div','mark');bar.appendChild(z);bar.appendChild(m);cook.mark=m;b.appendChild(bar);b.appendChild(btn('멈추기!',stopCook));});}
function stopCook(){if(!cook.active)return;cook.active=false;const r=cook.r;const c=cook.zs+cook.zw/2;const d=Math.abs(cook.p-c);
 let res,msg;if(d<0.05){res='perfect';}else if(d<0.13){res='good';}else res='bad';
 modal.style.display='none';uiOpen=false;
 if(res==='perfect'){add('dish_'+r.id,2);S.know+=2;msg=`✨ 대성공! ${r.e} ${r.n} <b>2개</b>를 만들었어요!`;}
 else if(res==='good'){add('dish_'+r.id,1);msg=`👍 잘 만들었어요! ${r.e} ${r.n} 1개 완성!`;}
 else{add('burnt',1);msg='🔥 앗, 타버렸어요… 불 조절이 어려워요.';}
 openModal(b=>{b.appendChild(el('h2','','요리 결과'));b.appendChild(el('p','',msg));
  b.appendChild(el('div','edu','💡 '+(res==='bad'?ITEMS.burnt.fact:r.edu)));
  const x=btn('또 요리하기',()=>{closeModal();renderKitchen();});b.appendChild(x);const c2=btn('나가기',closeModal);c2.classList.add('gray');b.appendChild(c2);});
 save(true);}

/* ----- 학교 퀴즈 ----- */
function schoolMenu(){menu('🏫 해피 학교','선생님: 어서 와요! 퀴즈를 맞히면 코인과 지식 점수를 받아요. (하루 보상 최대 10문제)',
 Object.keys(QUIZ).map(s=>({t:`${QUIZ[s].e} ${s} 퀴즈 (3문제)`,fn:()=>startQuiz(s)})));}
function startQuiz(sub){const qs=shuffle(QUIZ[sub].q).slice(0,3);let i=0,right=0;
 function ask(){const q=qs[i];const opts=shuffle(q.o.map((t,idx)=>({t,ok:idx===q.a})));
  openModal(b=>{b.appendChild(el('h2','',`${QUIZ[sub].e} ${sub} ${i+1}/3`));b.appendChild(el('p','',q.q));
   opts.forEach(o=>b.appendChild(btn(o.t,()=>answer(q,o.ok))));});}
 function answer(q,ok){let reward='';if(ok){right++;if(S.quiz<10){S.quiz++;S.coins+=10;S.know+=3;reward=' (+10코인)';}else{S.know+=1;reward=' (오늘 코인 보상은 끝!)';}}
  openModal(b=>{b.appendChild(el('h2','',ok?'⭕ 정답!'+reward:'❌ 아쉬워요'));b.appendChild(el('div','edu','💡 '+q.e));
   b.appendChild(btn(i<2?'다음 문제':'결과 보기',()=>{i++;if(i<3)ask();else finish();}));});}
 function finish(){openModal(b=>{b.appendChild(el('h2','','🎓 퀴즈 끝!'));b.appendChild(el('p','',`3문제 중 ${right}문제를 맞혔어요. ${right===3?'완벽해요! 🌟':right>=2?'잘했어요!':'다음엔 더 잘할 수 있어요!'}`));
  b.appendChild(btn('다른 퀴즈 풀기',()=>{closeModal();schoolMenu();}));const c=btn('나가기',closeModal);c.classList.add('gray');b.appendChild(c);});save(true);}
 ask();}

function collideBox(p,b,r){const cx=Math.max(b.x1,Math.min(p.x,b.x2)),cz=Math.max(b.z1,Math.min(p.z,b.z2));const dx=p.x-cx,dz=p.z-cz;const d2=dx*dx+dz*dz;
 if(d2<r*r){if(d2>1e-6){const d=Math.sqrt(d2);p.x=cx+dx/d*r;p.z=cz+dz/d*r;}else p.z=b.z2+r;}}

  let moving=false;if(ix||iz){const l=Math.hypot(ix,iz);ix/=l;iz/=l;
   const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);const mx=fx*iz+rx*ix,mz=fz*iz+rz*ix;
   let sp=(keys.ShiftLeft||keys.ShiftRight)?9.5:6;if(S.hunger<=0)sp*=0.6;player.position.x+=mx*sp*dt;player.position.z+=mz*sp*dt;
   const ty=Math.atan2(mx,mz);let df=ty-player.rotation.y;while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;player.rotation.y+=df*Math.min(1,dt*14);moving=true;
   if(fish.ph)endFish('낚시를 멈췄어요.',1000);}
  const pp=player.position;boxes.forEach(b=>collideBox(pp,b,0.6));circles.forEach(c=>{const dx=pp.x-c.x,dz=pp.z-c.z,d=Math.hypot(dx,dz),m=c.r+0.6;if(d<m&&d>1e-6){pp.x=c.x+dx/d*m;pp.z=c.z+dz/d*m;}});
  const rr=Math.hypot(pp.x,pp.z);if(rr>38){pp.x*=38/rr;pp.z*=38/rr;}

  else if(fish.ph===2){fish.t-=dt;bobber.position.y=0.05+Math.sin(tt*30)*0.08;if(fish.t<=0)endFish('놓쳤어요… 😢',1500);}
  // 상호작용 탐색
  nearest=null;let best=1e9;if(!fish.ph||true){inter.forEach(o=>{const p=o.pos();const d=Math.hypot(p.x-pp.x,p.z-pp.z);if(d<o.r&&d<best&&o.label()){best=d;nearest=o;}});}
  const pr=$('prompt');if(nearest){pr.style.display='block';pr.innerHTML='<b>E</b>'+nearest.label();}else pr.style.display='none';
  hudT+=dt;saveT+=dt;if(hudT>0.2){updateHUD();hudT=0;}if(saveT>20){save(true);saveT=0;}
 }else{ if(cook.active){cook.p+=cook.dir*cook.sp*dt;if(cook.p>=1){cook.p=1;cook.dir=-1;}if(cook.p<=0){cook.p=0;cook.dir=1;}if(cook.mark)cook.mark.style.left=`calc(${cook.p*100}% - 4px)`;}
  if(!started)yaw+=dt*0.1;$('prompt').style.display='none';hudT+=dt;if(hudT>0.3){updateHUD();hudT=0;}}
 ftrees.forEach(o=>{if(o.shake>0){o.shake-=dt;o.g.rotation.z=Math.sin(o.shake*40)*0.06*o.shake;}else o.g.rotation.z=0;});
 lighting();
 const tx=player.position.x+Math.sin(yaw)*Math.cos(pitch)*camDist,ty=player.position.y+1.6+Math.sin(pitch)*camDist,tz=player.position.z+Math.cos(yaw)*Math.cos(pitch)*camDist;
 camera.position.lerp(new THREE.Vector3(tx,ty,tz),Math.min(1,dt*8));camera.lookAt(player.position.x,1.8,player.position.z);
 renderer.render(scene,camera);}

/* ================= 시작 ================= */
function init(isNew){if(isNew)S=DEFAULT();else if(!load())S=DEFAULT();if(S.npcs.some(n=>!n.req))rollReq();
 plots.forEach(refreshPlot);ftrees.forEach(refreshTree);updateHUD();}
function titleScreen(){const saved=hasSave();openModal(b=>{b.appendChild(el('p','logo','🌸 Happy Town 🌸'));
 b.appendChild(el('p','','<center>요리하고, 농사짓고, 낚시하고, 배우는 포근한 3D 마을 생활!</center>'));
 b.appendChild(el('div','edu','🍳 요리 · 🌱 농사 · 🎣 낚시 · 🏫 학교 퀴즈 · 🧑‍🤝‍🧑 이웃 의뢰 · 🛏️ 하루 생활<br>모든 활동에서 <b>영양, 과학, 수학, 영어, 생활 습관</b>을 배워요.'));
 b.appendChild(el('div','keys','<span>WASD</span> 이동 <span>Shift</span> 달리기 <span>E</span> 상호작용 <span>Space</span> 낚시/요리 <span>마우스 드래그</span> 카메라'));
 const go=(nw)=>{closeModal();init(nw);started=true;uiOpen=false;toast('🌞 Happy Town에 오신 걸 환영해요!');if(nw)setTimeout(()=>renderHelp(),600);};
 if(saved)b.appendChild(btn('▶ 이어하기',()=>go(false)));
 const n=btn(saved?'🆕 새로 시작 (저장 삭제)':'▶ 시작하기',()=>go(true));if(saved)n.classList.add('gray');b.appendChild(n);});}
init(false);S=DEFAULT();plots.forEach(refreshPlot);ftrees.forEach(refreshTree);
titleScreen();requestAnimationFrame(frame);
})();
</script>
